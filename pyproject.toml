[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rbf-sbi"
version = "0.1.0"
description = "Bayesian neural networks versus neural posterior estimation for simulation-based inference with little data (companion code)"
requires-python = ">=3.11"
authors = [{ name = "Sam Dowd" }]

[tool.setuptools.packages.find]
where = ["src"]
